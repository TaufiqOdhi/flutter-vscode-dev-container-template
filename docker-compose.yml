services:
  flutter-dev:
    container_name: flutter-dev-container
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PATH=${PATH}:${FLUTTER_HOME}/bin:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
    privileged: true
    volumes:
      # USB devices for Android debugging (from devcontainer.json runArgs)
      - /dev/bus/usb/:/dev/bus/usb
      # Code workspace
      - ./workspace:${USER_HOME}/workspace
      # Caches based on devcontainer.json mounts
      - ./.dev-caches/.pub-cache:${USER_HOME}/.pub-cache
      - ./.dev-caches/.gradle:${USER_HOME}/.gradle
      - ./.dev-caches/.android:${USER_HOME}/.android
      # for Flutter SDK and Android SDK, if you want to persist them outside the container
      - ./flutter-sdk:${FLUTTER_HOME}
      - ./android-sdk:${ANDROID_HOME}
      # for ssh keys, git credentials, etc.
      - ~/.ssh:${USER_HOME}/.ssh
      # for Antigravity CLI
      - ./antigravity-sdk:${USER_HOME}/.gemini
      - .local/:${USER_HOME}/.local
      # for Git config
      - ${HOME}/.gitconfig:${USER_HOME}/.gitconfig
      # for vscode server config
      - ./vscode-config:${USER_HOME}/.config/code-server
    ports:
      # Forwarded ports from devcontainer.json
      - "8080:8080"
      - "5555:5555"
      - "8000:8000"
    user: vscode
    working_dir: ${USER_HOME}/workspace
    # Keep the container running
    tty: true
    stdin_open: true
    command: /bin/bash -c "code-server --bind-addr 0.0.0.0:8000 --auth none"
